[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geom-repr"
version = "0.1.0"
description = "Subspace Projection, Manifold Curvature, and CSDM for Training-Free Representation Learning"
readme = "README.md"
authors = [{ name = "İsmail Özçil" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.6.0"
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.7.0"
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geom_repr*"]
